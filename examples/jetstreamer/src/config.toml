[source]
archive-url = "https://api.old-faithful.net"
epoch = 885
threads = 4
network = "mainnet"
compact-index-base-url = "https://files.old-faithful.net"
network-capacity-mb = 1000

# Optional: enable upstream's sequential mode (single firehose worker thread
# with parallel ripget downloads, ≥150k TPS). When disabled, `threads` controls
# parallel firehose workers; when enabled, it controls ripget concurrency.
# sequential = false

# Optional: replay epochs newest-to-oldest (slots within an epoch stay
# ascending). Implies sequential mode upstream.
# reverse = false

# Optional: ripget hot/cold window in bytes; only used when sequential or
# reverse is enabled. Defaults to 256 MiB. Upstream's own default
# (min(4 GiB, 15% of RAM)) can be too large to download inside its 180s
# header-read timeout and hang the run. Raise on a fast link.
# buffer-window-bytes = 1073741824

[filters]
# Add any filters needed for parsing specific programs or accounts
# For example, to filter for specific programs:
# programs = ["11111111111111111111111111111112"]