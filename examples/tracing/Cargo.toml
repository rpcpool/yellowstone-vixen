[package]
name = "shipstern-example-tracing"
description = "Demostration of integrating Shipstern with tracing subscriber and OTEL"
publish = false
edition.workspace = true
license = "MIT"
repository = "https://github.com/solana-rpc/shipstern"

[dependencies]
clap = { version = "4.5.4", features = ["derive", "cargo", "wrap_help"] }
toml = "0.8.12"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
shipstern = { workspace = true }
rustls = { workspace = true }
tracing-opentelemetry = "0.30.0"
opentelemetry-appender-tracing = "0.29.0"
tokio = { version = "1.39.3", features = ["rt", "rt-multi-thread"] }
shipstern-spl-token-parser = { workspace = true }

# OTEL
opentelemetry = "0.29.1"
opentelemetry_sdk = { version = "0.32.1", features = [
  "metrics",
  "rt-tokio",
  "trace",
  # "rt-tokio-current-thread" # Spawn telemetry tasks on a separate runtime so that the main runtime won’t be blocked.
] }
opentelemetry-otlp = { version = "0.29.0", features = [
  "trace",
  "grpc-tonic",
  "gzip-tonic",
  "zstd-tonic",
] }
opentelemetry-stdout = "0.29.0"


# Sources
shipstern-yellowstone-grpc-source = { workspace = true }

[build-dependencies]
prost-build = "0.13.1"
