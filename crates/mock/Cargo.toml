[package]
name = "shipstern-mock"
description = "Mock implementation of the Shipstern Parsers for testing."
version.workspace = true
edition.workspace = true
readme = "./README.md"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
yellowstone-grpc-proto = { workspace = true }
solana-client.workspace = true
solana-sdk.workspace = true
solana-rpc-client-api.workspace = true
shipstern-core = { workspace = true }
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
# solana-transaction-status 4.x hides its whole API behind this feature; mock
# must ask for it rather than rely on unification with solana-ledger.
solana-transaction-status = { workspace = true, features = ["agave-unstable-api"] }
futures.workspace = true
