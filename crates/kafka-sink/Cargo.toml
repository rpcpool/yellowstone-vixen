[package]
name = "shipstern-kafka-sink"
description = "Kafka sink for Shipstern - writes blocks and instructions to Kafka with ordering guarantees"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Kafka
rdkafka = { workspace = true }

# Async
tokio = { workspace = true, features = ["sync", "rt"] }
futures = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
prost = { workspace = true }

# Shipstern
shipstern = { workspace = true }
shipstern-core = { workspace = true }
shipstern-block-coordinator = { workspace = true }

# Cancellation
tokio-util = { workspace = true }

# Logging
tracing = { workspace = true }

# HTTP client for Schema Registry
reqwest = { workspace = true }

[dev-dependencies]
mockito = "1"

[features]
experimental-account-parser = []
